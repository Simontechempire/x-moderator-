<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X-MODERATOR-BOT</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  min-height: 100vh;
  background: #080b12;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 420px;
  background: #111827;
  border: 1px solid #273449;
  border-radius: 20px;
  padding: 27px;
  box-shadow: 0 15px 45px #0008;
}

.logo {
  text-align: center;
  font-size: 48px;
  margin-bottom: 12px;
}

h1 {
  text-align: center;
  font-size: 23px;
  letter-spacing: 1px;
}

.subtitle {
  color: #9ca3af;
  text-align: center;
  font-size: 13px;
  margin: 10px 0 25px;
}

.status {
  padding: 12px;
  border-radius: 10px;
  background: #1c2939;
  text-align: center;
  color: #38d9a9;
  margin-bottom: 20px;
  font-size: 13px;
}

label {
  font-size: 13px;
  color: #cbd5e1;
}

input {
  width: 100%;
  padding: 15px;
  margin: 10px 0 15px;
  background: #080e19;
  color: white;
  border: 1px solid #34445d;
  border-radius: 10px;
  outline: none;
  font-size: 15px;
}

input:focus {
  border-color: #38bdf8;
}

button {
  width: 100%;
  padding: 15px;
  background: linear-gradient(120deg,#087cf0,#06b6d4);
  border: none;
  border-radius: 10px;
  color: white;
  font-weight: bold;
  font-size: 15px;
  cursor: pointer;
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.result {
  display: none;
  margin-top: 20px;
  background: #081a20;
  border: 1px solid #087c70;
  border-radius: 12px;
  padding: 20px;
  text-align: center;
}

.code {
  font-size: 28px;
  font-weight: bold;
  letter-spacing: 5px;
  color: #38d9a9;
  margin: 15px 0;
  overflow-wrap: anywhere;
}

.message {
  color: #cbd5e1;
  font-size: 13px;
  margin-top: 15px;
  line-height: 1.6;
}

.footer {
  text-align: center;
  color: #64748b;
  font-size: 11px;
  margin-top: 25px;
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">🛡️</div>

  <h1>X-MODERATOR-BOT</h1>

  <p class="subtitle">
    WhatsApp Group Moderator Connection Panel
  </p>

  <div class="status" id="status">
    ● Checking server...
  </div>

  <label>WhatsApp Number</label>

  <input
    id="number"
    type="tel"
    placeholder="234XXXXXXXXXX"
    autocomplete="tel"
  >

  <button id="connect" onclick="connectBot()">
    GENERATE PAIRING CODE
  </button>

  <div class="result" id="result">

    <p>YOUR PAIRING CODE</p>

    <div class="code" id="code"></div>

    <button onclick="copyCode()">
      COPY CODE
    </button>

    <p class="message">
      Open WhatsApp on your phone.<br>
      Go to Linked Devices → Link a Device →
      Link with phone number instead.<br>
      Enter the code displayed above.
    </p>

  </div>

  <p class="message" id="message"></p>

  <div class="footer">
    POWERED BY SIMON TECH INC
  </div>

</div>

<script>
async function checkStatus() {
  try {
    const response = await fetch("/api/status");
    const data = await response.json();

    document.getElementById("status").textContent =
      data.connected
        ? "● WhatsApp Connected"
        : "● Waiting for connection";

  } catch {
    document.getElementById("status").textContent =
      "● Server unavailable";
  }
}

async function connectBot() {
  const number = document.getElementById("number").value.trim();
  const button = document.getElementById("connect");
  const message = document.getElementById("message");
  const result = document.getElementById("result");

  if (!/^\d{10,15}$/.test(number)) {
    message.textContent = "Enter a valid number with country code, without +.";
    return;
  }

  button.disabled = true;
  button.textContent = "GENERATING...";
  message.textContent = "";
  result.style.display = "none";

  try {
    const response = await fetch("/pair", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ number })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.message);
    }

    if (!data.pairingCode) {
      throw new Error("No pairing code returned.");
    }

    document.getElementById("code").textContent =
      data.pairingCode;

    result.style.display = "block";

    message.textContent = data.message;

  } catch (error) {
    message.textContent = "❌ " + error.message;

  } finally {
    button.disabled = false;
    button.textContent = "GENERATE PAIRING CODE";
  }
}

function copyCode() {
  const code = document.getElementById("code").textContent;

  navigator.clipboard.writeText(code).then(() => {
    document.getElementById("message").textContent =
      "✅ Pairing code copied!";
  });
}

checkStatus();
setInterval(checkStatus, 10000);
</script>

</body>
  </html>
